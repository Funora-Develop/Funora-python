[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "funora"
version = "0.0.1.dev0"
description = "Unofficial multi-language framework for the FunPay marketplace - Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Funora Contributors" }]
keywords = ["funpay", "marketplace", "sdk", "unofficial"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "selectolax>=0.3.21",
]

[project.urls]
Homepage = "https://github.com/Funora-Develop"
Repository = "https://github.com/Funora-Develop/Funora-python"

[project.scripts]
funora-observe = "funora.observe:main"

[project.optional-dependencies]
# PyYAML нужен генератору из tools/codegen.py, а не самому пакету: читать
# спецификацию приходится при сборке, но не во время работы SDK.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.11", "ruff>=0.6", "PyYAML>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/funora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/funora"]
